<!--
  Apple Star Page Loader — Wave Letter
  A clean wave-animated wordmark. Each letter rises & falls in a smooth
  cascading wave. No progress bar, no percentage, no noise — just letters.
  Works with Latin (letter-level wave) AND Persian/Arabic (word-level wave)
  so RTL glyphs never appear mirrored or disconnected.
-->
<div class="asp-loader asp-theme-wave">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <!-- logo slot (filled by JS if user uploaded one) -->
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-wave{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,sans-serif;}
    .asp-theme-wave .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,#0a0a0f);backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-wave .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;}
    .asp-theme-wave .asp-wave-word{display:flex;align-items:baseline;gap:0.08em;justify-content:center;flex-wrap:wrap;max-width:94vw;font-weight:800;letter-spacing:0.08em;font-size:clamp(1.8rem,9vw,5rem);color:var(--asp-text,#fff);text-transform:uppercase;line-height:1;direction:ltr;}
    html[dir="rtl"] .asp-theme-wave .asp-wave-word{direction:rtl;text-transform:none;font-weight:700;letter-spacing:0;}
    .asp-theme-wave .asp-wave-word .ltr{display:inline-block;animation:aspLet 1.8s infinite ease-in-out;animation-delay:calc(var(--w)*0.12s);will-change:transform;}
    .asp-theme-wave .asp-wave-word .rtl{display:inline-block;animation:aspWord 2.2s infinite ease-in-out;animation-delay:calc(var(--w)*0.18s);will-change:transform,opacity;}
    .asp-theme-wave .asp-wave-word .sp{width:0.45em;display:inline-block;}
    .asp-theme-wave .asp-logo-wrap{margin-bottom:28px;}
    .asp-theme-wave .asp-logo-wrap img{max-height:90px;max-width:280px;object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,0.5));}
    @keyframes aspLet{
      0%,70%,100%{transform:translateY(0) scale(1);text-shadow:0 0 0 transparent;opacity:0.85;}
      35%{transform:translateY(-22px) scale(1.08);color:var(--asp-accent,#4aa3ff);text-shadow:0 10px 30px rgba(74,163,255,.55),0 0 24px var(--asp-accent,#4aa3ff);opacity:1;}
      50%{transform:translateY(4px) scale(0.95);}
    }
    @keyframes aspWord{
      0%,70%,100%{transform:translateY(0);opacity:0.7;}
      35%{transform:translateY(-14px);opacity:1;color:var(--asp-accent,#4aa3ff);text-shadow:0 8px 22px rgba(74,163,255,.45);}
      50%{transform:translateY(3px) scale(.97);opacity:.9;}
    }
    @media (prefers-reduced-motion: reduce){
      .asp-theme-wave .asp-wave-word .ltr,
      .asp-theme-wave .asp-wave-word .rtl{animation:none!important;color:var(--asp-text,#fff);opacity:1;}
    }
    @media (max-width:480px){
      .asp-theme-wave .asp-wave-word{letter-spacing:0.04em;}
      .asp-theme-wave .asp-wave-word .sp{width:0.3em;}
    }
  </style>
</div>
