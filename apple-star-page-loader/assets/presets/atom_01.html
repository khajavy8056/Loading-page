<svg class="asp-icon-svg" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur="0.4s" fill="freeze"/>
  <g transform="translate(90,90)">
    <ellipse rx="46" ry="14" fill="none" stroke="{{ACCENT}}" stroke-width="1.3" stroke-opacity=".55" transform="rotate(0)"/>
    <g transform="rotate(0) translate(46 0)">
      <circle r="5" fill="#ffffff">
            <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2.40s" begin="0.0s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.55;1" dur="1.2s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
    </g>
    <ellipse rx="46" ry="19" fill="none" stroke="{{ACCENT}}" stroke-width="1.3" stroke-opacity=".55" transform="rotate(180)"/>
    <g transform="rotate(180) translate(46 0)">
      <circle r="5" fill="#ffffff">
            <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2.40s" begin="-1.2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.55;1" dur="1.2s" begin="-0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle r="10" fill="#ffffff">
          <animate attributeName="r" values="9;12;9" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="{{ACCENT}}"/>
  </g>
</svg>
