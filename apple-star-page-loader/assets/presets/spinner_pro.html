<!--
  Preset: Spinner Pro — dual ring spinner + counter.
-->
<div class="asp-loader asp-theme-spin">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-spinner">
      <div class="asp-ring asp-ring-1"></div>
      <div class="asp-ring asp-ring-2"></div>
      <div class="asp-ring-core">
        <span class="asp-percent" data-value="0">0</span><span class="asp-percent-sign">%</span>
      </div>
    </div>
    <div class="asp-sub asp-wave-text"></div>
    <div class="asp-bar">
      <div class="asp-bar-fill"></div>
    </div>
    <div class="asp-tip"></div>
  </div>
  <style>
    .asp-theme-spin{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,sans-serif;}
    .asp-theme-spin .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,#0a0a0f);backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-spin .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;}
    .asp-theme-spin .asp-spinner{position:relative;width:clamp(110px,28vw,160px);height:clamp(110px,28vw,160px);}
    .asp-theme-spin .asp-ring{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;}
    .asp-theme-spin .asp-ring-1{border-top-color:var(--asp-accent,#4aa3ff);border-right-color:var(--asp-accent,#4aa3ff);animation:aspSpin 1.2s linear infinite;box-shadow:0 0 30px rgba(74,163,255,0.35) inset,0 0 20px rgba(74,163,255,0.2);}
    .asp-theme-spin .asp-ring-2{inset:14px;border-top-color:var(--asp-text,#fff);border-left-color:var(--asp-text,#fff);animation:aspSpin 1.8s linear infinite reverse;opacity:0.5;}
    .asp-theme-spin .asp-ring-core{position:absolute;inset:28px;border-radius:50%;background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,SF Mono,monospace;font-weight:800;font-size:clamp(1.1rem,3.5vw,1.6rem);color:var(--asp-text,#fff);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);direction:ltr;}
    .asp-theme-spin .asp-percent{font-variant-numeric:tabular-nums;}
    .asp-theme-spin .asp-percent.asp-digit-bounce{animation:aspDigitBounceS .4s ease-out;}
    .asp-theme-spin .asp-percent-sign{font-size:0.5em;opacity:0.6;margin-left:2px;}
    .asp-theme-spin .asp-sub{font-family:inherit;font-size:clamp(0.8rem,1.8vw,1rem);letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,255,255,0.75);font-weight:600;direction:rtl;unicode-bidi:plaintext;}
    html[dir="ltr"] .asp-theme-spin .asp-sub{direction:ltr;letter-spacing:0.4em;}
    .asp-theme-spin .asp-sub .asp-wave-letter,.asp-theme-spin .asp-sub .asp-wave-word{display:inline-block;animation:aspWaveS 2s infinite ease-in-out;animation-delay:calc(var(--w)*0.07s);}
    .asp-theme-spin .asp-bar{position:relative;width:min(320px,70vw);height:3px;background:var(--asp-bar-bg,rgba(255,255,255,0.1));border-radius:999px;overflow:hidden;}
    .asp-theme-spin .asp-bar-fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--asp-accent,#4aa3ff),var(--asp-text,#fff));border-radius:999px;transition:width .35s cubic-bezier(.22,1,.36,1);}
    .asp-theme-spin .asp-tip{font-size:12px;color:rgba(255,255,255,0.45);font-family:inherit;letter-spacing:0.1em;min-height:16px;text-align:center;direction:rtl;unicode-bidi:plaintext;}
    html[dir="ltr"] .asp-theme-spin .asp-tip{direction:ltr;}
    .asp-theme-spin .asp-logo-wrap img{max-height:60px;max-width:200px;object-fit:contain;margin-bottom:8px;}
    @keyframes aspSpin{to{transform:rotate(360deg);}}
    @keyframes aspWaveS{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
    @keyframes aspDigitBounceS{0%{transform:scale(1);}40%{transform:scale(1.2);}100%{transform:scale(1);}}
    @media (prefers-reduced-motion: reduce){.asp-theme-spin .asp-ring,.asp-theme-spin .asp-sub .asp-wave-letter,.asp-theme-spin .asp-sub .asp-wave-word{animation:none!important;}.asp-theme-spin .asp-ring-2{display:none;}}
  </style>
</div>
