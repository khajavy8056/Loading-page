<!--
  Preset: Bars — نوارهای عمودی مانند اکولایزر صدا (موج عمودی).
  ساده و جذاب، برای فارسی هم عالی است.
-->
<div class="asp-loader asp-theme-bars">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-bars">
      <span style="--b:0"></span><span style="--b:1"></span><span style="--b:2"></span>
      <span style="--b:3"></span><span style="--b:4"></span><span style="--b:5"></span>
      <span style="--b:6"></span><span style="--b:7"></span>
    </div>
    <div class="asp-sub asp-wave-text"></div>
    <div class="asp-percent-row">
      <span class="asp-percent" data-value="0">0</span><span class="asp-percent-sign">%</span>
    </div>
    <div class="asp-bar"><div class="asp-bar-fill"></div></div>
    <div class="asp-tip"></div>
  </div>
  <style>
    .asp-theme-bars{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,sans-serif;}
    .asp-theme-bars .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,#111827);backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-bars .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;}
    .asp-theme-bars .asp-bars{display:flex;align-items:flex-end;gap:8px;height:70px;}
    .asp-theme-bars .asp-bars span{width:8px;height:20px;background:linear-gradient(180deg,var(--asp-accent,#4aa3ff),#a855f7);border-radius:4px;animation:aspBarEQ 1s infinite ease-in-out;animation-delay:calc(var(--b)*0.1s);box-shadow:0 0 16px var(--asp-accent,#4aa3ff);}
    .asp-theme-bars .asp-sub{font-size:15px;color:rgba(255,255,255,0.8);letter-spacing:.15em;text-transform:uppercase;font-weight:600;direction:rtl;unicode-bidi:plaintext;}
    html[dir="ltr"] .asp-theme-bars .asp-sub{direction:ltr;letter-spacing:.3em;}
    .asp-theme-bars .asp-sub .asp-wave-word{display:inline-block;animation:aspSubBars 2s infinite ease-in-out;}
    .asp-theme-bars .asp-percent-row{font-family:ui-monospace,SF Mono,monospace;font-weight:700;font-size:clamp(1.8rem,6vw,2.8rem);color:var(--asp-text,#fff);direction:ltr;display:flex;align-items:baseline;text-shadow:0 0 25px var(--asp-accent,#4aa3ff);}
    .asp-theme-bars .asp-percent{font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right;}
    .asp-theme-bars .asp-percent.asp-digit-bounce{animation:aspDigitBars .4s ease-out;}
    .asp-theme-bars .asp-percent-sign{font-size:.5em;opacity:.6;margin-left:4px;}
    .asp-theme-bars .asp-bar{width:min(300px,72vw);height:3px;background:var(--asp-bar-bg,rgba(255,255,255,.1));border-radius:999px;overflow:hidden;}
    .asp-theme-bars .asp-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--asp-accent,#4aa3ff),#a855f7);border-radius:999px;transition:width .35s cubic-bezier(.22,1,.36,1);}
    .asp-theme-bars .asp-tip{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.1em;min-height:14px;direction:rtl;unicode-bidi:plaintext;}
    html[dir="ltr"] .asp-theme-bars .asp-tip{direction:ltr;}
    @keyframes aspBarEQ{0%,100%{height:20px;}50%{height:65px;}}
    @keyframes aspSubBars{0%,100%{opacity:.7;}50%{opacity:1;}}
    @keyframes aspDigitBars{0%{transform:translateY(0);}40%{transform:translateY(-8px) scale(1.1);}100%{transform:translateY(0);}}
    @media (prefers-reduced-motion: reduce){.asp-theme-bars .asp-bars span,.asp-theme-bars .asp-sub .asp-wave-word{animation:none!important;}.asp-theme-bars .asp-bars span{height:40px;}}
    @media (max-width:380px){.asp-theme-bars .asp-bars span{width:6px;}}
  </style>
</div>
