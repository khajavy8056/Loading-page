{{LOGO}}
<svg class="asp-icon-svg" viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg">
  <line x1="4" y1="40" x2="156" y2="40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Moving blip (combines sweep with a vertical heartbeat bounce) -->
  <circle cx="10" cy="40" r="5" fill="{{ACCENT}}">
    <animate attributeName="cx" values="10;150" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;40;40;20;55;35;40;40" keyTimes="0;0.4;0.44;0.45;0.5;0.55;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Glow -->
  <circle cx="10" cy="40" r="5" fill="{{ACCENT}}" opacity="0.5">
    <animate attributeName="cx" values="10;150" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r"  values="6;18;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.08;0.92;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
<div class="asp-brand-text" {{DIR}}>{{TEXT}}</div>
{{MAINT}}
