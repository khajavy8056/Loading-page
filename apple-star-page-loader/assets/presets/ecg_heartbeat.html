<!-- ECG Heartbeat: pure monitor-line + bouncing blip (no text inside ECG) -->
<div class="asp-loader asp-theme-ecg">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-ecg-mon">
      <div class="asp-ecg-line"></div>
      <div class="asp-ecg-blip2"></div>
    </div>
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-ecg{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif;}
    .asp-theme-ecg .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85));backdrop-filter:blur(var(--asp-blur,12px));-webkit-backdrop-filter:blur(var(--asp-blur,12px));}
    .asp-theme-ecg .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;}
    .asp-theme-ecg .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-ecg .asp-ecg-mon{position:relative;width:140px;height:50px;}
    .asp-theme-ecg .asp-ecg-line{position:absolute;top:50%;left:0;width:100%;height:2px;background:rgba(255,255,255,0.25);}
    .asp-theme-ecg .asp-ecg-blip2{position:absolute;top:50%;left:0;width:10px;height:10px;background:var(--asp-accent,#00ff88);border-radius:50%;transform:translateY(-50%);box-shadow:0 0 16px var(--asp-accent,#00ff88);animation:asp-ecg-sw 2s infinite linear,asp-ecg-bb 2s infinite ease-in-out;}
    @keyframes asp-ecg-sw{0%{left:0;opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{left:100%;opacity:0;}}
    @keyframes asp-ecg-bb{0%,40%,60%,100%{transform:translateY(-50%);}45%{transform:translateY(calc(-50% - 20px));}50%{transform:translateY(calc(-50% + 15px));}55%{transform:translateY(calc(-50% - 5px));}}
    .asp-theme-ecg .asp-wave-word{display:flex;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:90vw;font-weight:700;letter-spacing:.18em;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--asp-text,#fff);opacity:.9;direction:ltr;}
    html[dir="rtl"] .asp-theme-ecg .asp-wave-word{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-ecg .asp-wave-word .ltr,.asp-theme-ecg .asp-wave-word .rtl{display:inline-block;}
    .asp-theme-ecg .asp-wave-word .sp{width:.4em;display:inline-block;}
    @media (prefers-reduced-motion: reduce){.asp-theme-ecg .asp-ecg-blip2{animation:none;left:50%!important;transform:translate(-50%,-50%)!important;opacity:1!important;}}
  </style>
</div>
