<!-- Classic Pulse: single dot that rings outward -->
<div class="asp-loader asp-theme-pulse-classic">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-pulse-dot"></div>
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-pulse-classic{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif;}
    .asp-theme-pulse-classic .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85));backdrop-filter:blur(var(--asp-blur,12px));-webkit-backdrop-filter:blur(var(--asp-blur,12px));}
    .asp-theme-pulse-classic .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;}
    .asp-theme-pulse-classic .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-pulse-classic .asp-pulse-dot{width:40px;height:40px;background:var(--asp-text,#fff);border-radius:50%;animation:asp-pc 1.5s infinite ease-in-out;}
    @keyframes asp-pc{0%{transform:scale(0.8);box-shadow:0 0 0 0 var(--asp-accent,rgba(255,255,255,.7));}70%{transform:scale(1);box-shadow:0 0 0 20px rgba(255,255,255,0);}100%{transform:scale(0.8);box-shadow:0 0 0 0 rgba(255,255,255,0);}}
    .asp-theme-pulse-classic .asp-wave-word{display:flex;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:90vw;font-weight:700;letter-spacing:.18em;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--asp-text,#fff);opacity:.9;direction:ltr;}
    html[dir="rtl"] .asp-theme-pulse-classic .asp-wave-word{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-pulse-classic .asp-wave-word .ltr,.asp-theme-pulse-classic .asp-wave-word .rtl{display:inline-block;}
    .asp-theme-pulse-classic .asp-wave-word .sp{width:.4em;display:inline-block;}
    @media (prefers-reduced-motion: reduce){.asp-theme-pulse-classic .asp-pulse-dot{animation:none;}}
  </style>
</div>
