<!-- Equalizer Bars: 5 vertical bars dancing like a frequency display -->
<div class="asp-loader asp-theme-freq">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-freq-bars"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-freq{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif;}
    .asp-theme-freq .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85));backdrop-filter:blur(var(--asp-blur,12px));-webkit-backdrop-filter:blur(var(--asp-blur,12px));}
    .asp-theme-freq .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;}
    .asp-theme-freq .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-freq .asp-freq-bars{display:flex;gap:5px;align-items:center;height:50px;}
    .asp-theme-freq .asp-freq-bars span{display:block;width:5px;height:30px;background:var(--asp-text,#fff);border-radius:4px;animation:asp-frq 1s infinite ease-in-out;}
    .asp-theme-freq .asp-freq-bars span:nth-child(1){animation-delay:-0.4s;}
    .asp-theme-freq .asp-freq-bars span:nth-child(2){animation-delay:-0.2s;}
    .asp-theme-freq .asp-freq-bars span:nth-child(3){animation-delay:0s;height:44px;background:var(--asp-accent,#00c3ff);box-shadow:0 0 14px var(--asp-accent,rgba(0,195,255,.6));}
    .asp-theme-freq .asp-freq-bars span:nth-child(4){animation-delay:-0.2s;}
    .asp-theme-freq .asp-freq-bars span:nth-child(5){animation-delay:-0.4s;}
    @keyframes asp-frq{0%,100%{transform:scaleY(.3);opacity:.5;}50%{transform:scaleY(1);opacity:1;}}
    .asp-theme-freq .asp-wave-word{display:flex;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:90vw;font-weight:700;letter-spacing:.18em;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--asp-text,#fff);opacity:.9;direction:ltr;}
    html[dir="rtl"] .asp-theme-freq .asp-wave-word{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-freq .asp-wave-word .ltr,.asp-theme-freq .asp-wave-word .rtl{display:inline-block;}
    .asp-theme-freq .asp-wave-word .sp{width:.4em;display:inline-block;}
    @media (prefers-reduced-motion: reduce){.asp-theme-freq .asp-freq-bars span{animation:none;height:30px!important;}}
  </style>
</div>
