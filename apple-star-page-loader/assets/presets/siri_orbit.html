<!-- Siri Orbit: 3 rotating rings (like Siri's indicator) -->
<div class="asp-loader asp-theme-siri">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-siri"><div></div><div></div><div></div></div>
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-siri{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif;}
    .asp-theme-siri .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85));backdrop-filter:blur(var(--asp-blur,12px));-webkit-backdrop-filter:blur(var(--asp-blur,12px));}
    .asp-theme-siri .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;}
    .asp-theme-siri .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-siri .asp-siri{width:56px;height:56px;position:relative;}
    .asp-theme-siri .asp-siri div{position:absolute;inset:0;border:2px solid transparent;border-radius:50%;animation:asp-spin 2s infinite linear;}
    .asp-theme-siri .asp-siri div:nth-child(1){border-top-color:var(--asp-text,#fff);animation-duration:1s;}
    .asp-theme-siri .asp-siri div:nth-child(2){border-right-color:var(--asp-accent,rgba(255,255,255,.7));animation-duration:1.5s;animation-direction:reverse;}
    .asp-theme-siri .asp-siri div:nth-child(3){border-bottom-color:rgba(255,255,255,.4);animation-duration:2s;}
    @keyframes asp-spin{100%{transform:rotate(360deg);}}
    .asp-theme-siri .asp-wave-word{display:flex;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:90vw;font-weight:700;letter-spacing:.18em;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--asp-text,#fff);opacity:.9;direction:ltr;}
    html[dir="rtl"] .asp-theme-siri .asp-wave-word{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-siri .asp-wave-word .ltr,.asp-theme-siri .asp-wave-word .rtl{display:inline-block;}
    .asp-theme-siri .asp-wave-word .sp{width:.4em;display:inline-block;}
    @media (prefers-reduced-motion: reduce){.asp-theme-siri .asp-siri div{animation:none;border-color:var(--asp-text,#fff)!important;opacity:.7;}}
  </style>
</div>
