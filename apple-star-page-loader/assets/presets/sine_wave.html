<!-- Sine Wave Dots: four dots rising/falling out of phase -->
<div class="asp-loader asp-theme-sine">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-sine"><div></div><div></div><div></div><div></div></div>
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-sine{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif;}
    .asp-theme-sine .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85));backdrop-filter:blur(var(--asp-blur,12px));-webkit-backdrop-filter:blur(var(--asp-blur,12px));}
    .asp-theme-sine .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;}
    .asp-theme-sine .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-sine .asp-sine{display:flex;gap:10px;align-items:center;height:50px;}
    .asp-theme-sine .asp-sine div{width:12px;height:12px;background:var(--asp-text,#fff);border-radius:50%;animation:asp-sn 1.2s infinite ease-in-out;}
    .asp-theme-sine .asp-sine div:nth-child(1){animation-delay:0s;}
    .asp-theme-sine .asp-sine div:nth-child(2){animation-delay:.15s;}
    .asp-theme-sine .asp-sine div:nth-child(3){animation-delay:.3s;}
    .asp-theme-sine .asp-sine div:nth-child(4){animation-delay:.45s;}
    @keyframes asp-sn{0%,100%{transform:translateY(0) scale(.8);opacity:.5;}50%{transform:translateY(-18px) scale(1.2);opacity:1;box-shadow:0 0 14px var(--asp-text,#fff);}}
    .asp-theme-sine .asp-wave-word{display:flex;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:90vw;font-weight:700;letter-spacing:.18em;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--asp-text,#fff);opacity:.9;direction:ltr;}
    html[dir="rtl"] .asp-theme-sine .asp-wave-word{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-sine .asp-wave-word .ltr,.asp-theme-sine .asp-wave-word .rtl{display:inline-block;}
    .asp-theme-sine .asp-wave-word .sp{width:.4em;display:inline-block;}
    @media (prefers-reduced-motion: reduce){.asp-theme-sine .asp-sine div{animation:none;transform:none!important;opacity:1!important;}}
  </style>
</div>
