<!--
  Preset: Apple Star (Glass) — v2.0
  Pre-rendered wave wordmark "APPLE STAR", rolling percentage counter,
  animated progress bar, glass backdrop card, scanner shine.
-->
<div class="asp-loader asp-theme-apple-star">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-wordmark">
      <span class="asp-wave-letter" style="--w:0">A</span>
      <span class="asp-wave-letter" style="--w:1">P</span>
      <span class="asp-wave-letter" style="--w:2">P</span>
      <span class="asp-wave-letter" style="--w:3">L</span>
      <span class="asp-wave-letter" style="--w:4">E</span>
      <span class="asp-wave-letter asp-space" style="--w:5">&nbsp;</span>
      <span class="asp-wave-letter" style="--w:6">S</span>
      <span class="asp-wave-letter" style="--w:7">T</span>
      <span class="asp-wave-letter" style="--w:8">A</span>
      <span class="asp-wave-letter" style="--w:9">R</span>
    </div>

    <div class="asp-sub-text asp-wave-text"></div>

    <div class="asp-progress">
      <div class="asp-percent-wrap">
        <span class="asp-percent" data-value="0">0</span><span class="asp-percent-sign">%</span>
      </div>
      <div class="asp-bar">
        <div class="asp-bar-fill"></div>
        <div class="asp-bar-shine"></div>
      </div>
    </div>

    <div class="asp-tip"></div>
  </div>

  <style>
    .asp-theme-apple-star{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .asp-theme-apple-star .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(5,5,10,0.92));backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-apple-star .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;max-width:92vw;padding:32px 40px;border-radius:22px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);box-shadow:0 30px 100px rgba(0,0,0,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
    .asp-theme-apple-star .asp-wordmark{display:flex;align-items:center;gap:4px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-weight:800;letter-spacing:0.14em;font-size:clamp(1.4rem,5.5vw,2.6rem);text-transform:uppercase;color:var(--asp-text,#fff);margin-bottom:4px;}
    .asp-theme-apple-star .asp-wordmark .asp-wave-letter{display:inline-block;color:var(--asp-text,#fff);animation:aspStarWave 2.6s infinite ease-in-out;animation-delay:calc(var(--w)*0.13s);will-change:transform,color,text-shadow;}
    .asp-theme-apple-star .asp-wordmark .asp-wave-letter.asp-space{width:0.55em;}

    .asp-theme-apple-star .asp-sub-text{font-family:-apple-system,sans-serif;font-size:clamp(0.75rem,1.5vw,0.9rem);letter-spacing:0.45em;text-transform:uppercase;color:rgba(255,255,255,0.65);font-weight:500;}
    .asp-theme-apple-star .asp-sub-text .asp-wave-letter{display:inline-block;animation:aspStarSubWave 2.2s infinite ease-in-out;animation-delay:calc(var(--w)*0.08s);}

    .asp-theme-apple-star .asp-progress{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:min(420px,80vw);}
    .asp-theme-apple-star .asp-percent-wrap{font-family:-apple-system,SF Mono,ui-monospace,monospace;font-weight:700;font-size:clamp(2rem,7vw,3rem);color:var(--asp-text,#fff);letter-spacing:0.02em;display:flex;align-items:baseline;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(74,163,255,0.25);}
    .asp-theme-apple-star .asp-percent{display:inline-block;min-width:1.6em;text-align:right;}
    .asp-theme-apple-star .asp-percent.asp-digit-bounce{animation:aspDigitBounce 0.45s ease-out;}
    .asp-theme-apple-star .asp-percent-sign{font-size:0.5em;opacity:0.6;margin-left:4px;}
    .asp-theme-apple-star .asp-bar{position:relative;width:100%;height:4px;background:var(--asp-bar-bg,rgba(255,255,255,0.12));border-radius:999px;overflow:hidden;}
    .asp-theme-apple-star .asp-bar-fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--asp-accent,#4aa3ff),var(--asp-text,#fff));border-radius:999px;transition:width 0.35s cubic-bezier(0.22,1,0.36,1);box-shadow:0 0 12px var(--asp-accent,#4aa3ff);}
    .asp-theme-apple-star .asp-bar-shine{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);animation:aspBarShine 1.8s infinite;}
    .asp-theme-apple-star .asp-tip{font-family:-apple-system,sans-serif;font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:0.12em;text-align:center;min-height:16px;}
    .asp-theme-apple-star .asp-logo-wrap{max-height:60px;margin-bottom:2px;}
    .asp-theme-apple-star .asp-logo-wrap img{max-height:60px;max-width:200px;object-fit:contain;filter:drop-shadow(0 4px 18px rgba(0,0,0,0.5));}

    @keyframes aspStarWave{
      0%,100%{transform:translateY(0) scale(1);opacity:0.55;text-shadow:0 0 0 transparent;color:var(--asp-text,#fff);}
      25%{transform:translateY(-16px) scale(1.2);opacity:1;color:var(--asp-accent,#4aa3ff);text-shadow:0 0 22px var(--asp-accent,#4aa3ff),0 14px 30px rgba(74,163,255,0.4);}
      40%{transform:translateY(5px) scale(0.92);opacity:0.95;}
      55%{transform:translateY(0) scale(1);opacity:1;}
    }
    @keyframes aspStarSubWave{0%,100%{transform:translateY(0);opacity:0.65;}50%{transform:translateY(-4px);opacity:1;}}
    @keyframes aspBarShine{0%{left:-40%;}100%{left:120%;}}
    @keyframes aspDigitBounce{0%{transform:translateY(0);}30%{transform:translateY(-8px) scale(1.08);}60%{transform:translateY(2px) scale(0.98);}100%{transform:translateY(0);}}

    @media (prefers-reduced-motion: reduce){
      .asp-theme-apple-star .asp-wordmark .asp-wave-letter,
      .asp-theme-apple-star .asp-sub-text .asp-wave-letter,
      .asp-theme-apple-star .asp-bar-shine{animation:none!important;}
      .asp-theme-apple-star .asp-wordmark .asp-wave-letter{opacity:1;}
    }
    @media (max-width:480px){
      .asp-theme-apple-star .asp-stage{padding:24px 22px;gap:18px;}
      .asp-theme-apple-star .asp-wordmark{letter-spacing:0.08em;}
    }
  </style>
</div>
