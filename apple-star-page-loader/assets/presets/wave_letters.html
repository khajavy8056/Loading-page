<!--
  Preset: Wave Letters — bold wave-animated letters + counter.
-->
<div class="asp-loader asp-theme-wave">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-wave-word"></div>
    <div class="asp-percent-row">
      <span class="asp-percent" data-value="0">0</span><span class="asp-percent-sign">%</span>
    </div>
    <div class="asp-bar">
      <div class="asp-bar-fill"></div>
      <div class="asp-bar-dot"></div>
    </div>
    <div class="asp-tip"></div>
  </div>
  <style>
    .asp-theme-wave{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--asp-bg,#111);}
    .asp-theme-wave .asp-backdrop{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(74,163,255,0.15),transparent 60%),var(--asp-bg,#0d1117);backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-wave .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:28px;}
    .asp-theme-wave .asp-wave-word{display:flex;gap:clamp(4px,1vw,10px);font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:900;font-size:clamp(2rem,10vw,5rem);letter-spacing:0.08em;text-transform:uppercase;color:var(--asp-text,#fff);}
    .asp-theme-wave .asp-wave-word .asp-wave-letter{display:inline-block;animation:aspWaveUp 1.6s infinite ease-in-out;animation-delay:calc(var(--w)*0.1s);background:linear-gradient(180deg,var(--asp-text,#fff) 0%,var(--asp-accent,#4aa3ff) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(74,163,255,0.35));}
    .asp-theme-wave .asp-wave-word .asp-wave-letter.asp-space{width:0.4em;}
    .asp-theme-wave .asp-percent-row{font-family:ui-monospace,SF Mono,Menlo,monospace;font-weight:800;font-size:clamp(2.5rem,9vw,4rem);color:var(--asp-text,#fff);display:flex;align-items:baseline;text-shadow:0 0 30px rgba(74,163,255,0.4);}
    .asp-theme-wave .asp-percent{display:inline-block;font-variant-numeric:tabular-nums;min-width:1.8em;text-align:right;}
    .asp-theme-wave .asp-percent-sign{font-size:0.5em;opacity:0.7;margin-left:4px;}
    .asp-theme-wave .asp-percent.asp-digit-bounce{animation:aspDigitBounceW 0.4s ease-out;}
    .asp-theme-wave .asp-bar{position:relative;width:min(500px,80vw);height:6px;background:var(--asp-bar-bg,rgba(255,255,255,0.08));border-radius:999px;overflow:hidden;}
    .asp-theme-wave .asp-bar-fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--asp-accent,#4aa3ff),#a855f7,var(--asp-accent,#4aa3ff));background-size:200% 100%;border-radius:999px;transition:width 0.35s cubic-bezier(0.22,1,0.36,1);animation:aspBarGradient 2s linear infinite;}
    .asp-theme-wave .asp-bar-dot{position:absolute;top:50%;left:0;width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 0 20px 4px var(--asp-accent,#4aa3ff);transform:translate(-50%,-50%);transition:left 0.35s cubic-bezier(0.22,1,0.36,1);}
    .asp-theme-wave .asp-tip{font-family:-apple-system,sans-serif;font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:0.2em;text-transform:uppercase;text-align:center;min-height:18px;}
    .asp-theme-wave .asp-logo-wrap{margin-bottom:6px;}
    .asp-theme-wave .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 20px rgba(74,163,255,0.4));}

    @keyframes aspWaveUp{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-18px) rotate(-3deg);}}
    @keyframes aspDigitBounceW{0%{transform:translateY(0) scale(1);}35%{transform:translateY(-10px) scale(1.15);}70%{transform:translateY(2px) scale(0.97);}100%{transform:translateY(0) scale(1);}}
    @keyframes aspBarGradient{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}

    @media (prefers-reduced-motion: reduce){
      .asp-theme-wave .asp-wave-word .asp-wave-letter,.asp-theme-wave .asp-bar-fill{animation:none!important;}
    }
  </style>
</div>
