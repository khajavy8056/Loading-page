<div class="asld asld--typing" dir="ltr" role="status" aria-label="Loading">
  <div class="asld__card">
    <p class="asld__text">LOADING<span class="asld__dots"><span>.</span><span>.</span><span>.</span></span></p>
    <div class="asld__cursor"></div>
  </div>
  <p class="asld__hint">Please wait</p>
</div>
<style>
body{overflow:hidden!important}
.asld{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:99999999;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"Consolas",monospace;gap:14px}
.asld__card{display:flex;align-items:center;gap:6px;background:#f5f5f7;border:1px solid #e8e8ed;border-radius:12px;padding:16px 22px;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.asld__text{font-size:clamp(1.1rem,5vw,1.7rem);font-weight:800;letter-spacing:0.28em;color:#1d1d1f;margin:0}
.asld__dots span{display:inline-block;animation:asld-bounce-dot 1.15s infinite;opacity:0}
.asld__dots span:nth-child(1){animation-delay:0s}
.asld__dots span:nth-child(2){animation-delay:0.2s}
.asld__dots span:nth-child(3){animation-delay:0.4s}
.asld__cursor{width:3px;height:clamp(18px,4vw,24px);background:#0071e3;border-radius:2px;animation:asld-cursor 0.9s infinite step-end}
.asld__hint{font-size:clamp(0.7rem,2vw,0.78rem);letter-spacing:0.35em;color:rgba(0,0,0,0.42);margin:0;text-transform:uppercase}
@keyframes asld-bounce-dot{0%,20%{opacity:0;transform:translateY(0)}30%,60%{opacity:1;transform:translateY(-4px)}80%,100%{opacity:0;transform:translateY(0)}}
@keyframes asld-cursor{0%,50%{opacity:1}51%,100%{opacity:0}}
@media (max-width:480px){.asld__card{padding:12px 16px}.asld__text{letter-spacing:0.18em}}
@media (prefers-reduced-motion: reduce){.asld__dots span,.asld__cursor{animation:none!important;opacity:1}}
</style>
