<!--
  Preset: Minimal Dot — single pulsing dot + minimal counter.
-->
<div class="asp-loader asp-theme-minimal">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-dot">
      <div class="asp-dot-core"></div>
      <div class="asp-dot-ring asp-dot-ring-1"></div>
      <div class="asp-dot-ring asp-dot-ring-2"></div>
      <div class="asp-dot-ring asp-dot-ring-3"></div>
    </div>
    <div class="asp-percent-row">
      <span class="asp-percent" data-value="0">0</span><span class="asp-percent-sign">%</span>
    </div>
    <div class="asp-wave-text asp-sub"></div>
    <div class="asp-bar">
      <div class="asp-bar-fill"></div>
    </div>
    <div class="asp-tip"></div>
  </div>
  <style>
    .asp-theme-minimal{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .asp-theme-minimal .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,#ffffff);backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-minimal .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;}
    .asp-theme-minimal .asp-dot{position:relative;width:40px;height:40px;margin-bottom:10px;}
    .asp-theme-minimal .asp-dot-core{position:absolute;top:50%;left:50%;width:12px;height:12px;background:var(--asp-accent,#111);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px var(--asp-accent,#111);animation:aspDotPulse 1.4s infinite ease-in-out;}
    .asp-theme-minimal .asp-dot-ring{position:absolute;top:50%;left:50%;border:2px solid var(--asp-accent,#111);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:aspDotRing 2s infinite ease-out;}
    .asp-theme-minimal .asp-dot-ring-1{animation-delay:0s;}
    .asp-theme-minimal .asp-dot-ring-2{animation-delay:0.6s;}
    .asp-theme-minimal .asp-dot-ring-3{animation-delay:1.2s;}
    .asp-theme-minimal .asp-percent-row{font-family:ui-monospace,SF Mono,Menlo,monospace;font-weight:300;font-size:clamp(1rem,2.2vw,1.2rem);color:var(--asp-text,#111);letter-spacing:0.1em;display:flex;align-items:baseline;}
    .asp-theme-minimal .asp-percent{font-variant-numeric:tabular-nums;}
    .asp-theme-minimal .asp-percent.asp-digit-bounce{animation:aspDigitBounceM 0.3s ease-out;}
    .asp-theme-minimal .asp-percent-sign{font-size:0.8em;opacity:0.6;margin-left:2px;}
    .asp-theme-minimal .asp-sub{font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:0.4em;text-transform:uppercase;color:var(--asp-text,#111);opacity:0.5;font-weight:500;}
    .asp-theme-minimal .asp-sub .asp-wave-letter{display:inline-block;animation:aspWaveM 2.2s infinite ease-in-out;animation-delay:calc(var(--w)*0.08s);}
    .asp-theme-minimal .asp-bar{position:relative;width:min(220px,50vw);height:2px;background:var(--asp-bar-bg,rgba(0,0,0,0.08));border-radius:999px;overflow:hidden;}
    .asp-theme-minimal .asp-bar-fill{position:absolute;inset:0;width:0%;background:var(--asp-bar-fg,var(--asp-accent,#111));border-radius:999px;transition:width 0.3s cubic-bezier(0.22,1,0.36,1);}
    .asp-theme-minimal .asp-tip{font-size:10px;color:var(--asp-text,#111);opacity:0.4;font-family:-apple-system,sans-serif;letter-spacing:0.1em;min-height:14px;text-align:center;margin-top:4px;}
    .asp-theme-minimal .asp-logo-wrap img{max-height:40px;max-width:160px;object-fit:contain;opacity:0.9;margin-bottom:8px;}
    @keyframes aspDotPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.4);}}
    @keyframes aspDotRing{0%{width:12px;height:12px;opacity:0.6;}100%{width:70px;height:70px;opacity:0;}}
    @keyframes aspWaveM{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
    @keyframes aspDigitBounceM{0%{transform:translateY(0);}50%{transform:translateY(-4px);}100%{transform:translateY(0);}}
    @media (prefers-reduced-motion: reduce){
      .asp-theme-minimal .asp-dot-core,.asp-theme-minimal .asp-dot-ring,.asp-theme-minimal .asp-sub .asp-wave-letter{animation:none!important;}
      .asp-theme-minimal .asp-dot-ring{display:none;}
    }
  </style>
</div>
