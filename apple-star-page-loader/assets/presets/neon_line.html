<!--
  Preset: Neon Line — یک خط نئون که از چپ به راست کشیده می‌شود، با متن و درصد.
  خیلی تمیز و مدرن.
-->
<div class="asp-loader asp-theme-neon">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-neon"><span></span></div>
    <div class="asp-sub asp-wave-text"></div>
    <div class="asp-percent-row">
      <span class="asp-percent" data-value="0">0</span><span class="asp-percent-sign">%</span>
    </div>
    <div class="asp-tip"></div>
  </div>
  <style>
    .asp-theme-neon{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,sans-serif;}
    .asp-theme-neon .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,#0a0a0f);backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-neon .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;}
    .asp-theme-neon .asp-neon{position:relative;width:min(240px,60vw);height:2px;background:var(--asp-bar-bg,rgba(255,255,255,.1));border-radius:2px;overflow:visible;}
    .asp-theme-neon .asp-neon span{position:absolute;top:-3px;left:0;width:60px;height:8px;background:var(--asp-accent,#00ffc6);border-radius:8px;box-shadow:0 0 20px var(--asp-accent,#00ffc6),0 0 40px var(--asp-accent,#00ffc6);animation:aspNeon 1.6s infinite ease-in-out;}
    .asp-theme-neon .asp-sub{font-size:14px;letter-spacing:.35em;text-transform:uppercase;color:var(--asp-text,#fff);font-weight:500;opacity:.85;direction:rtl;unicode-bidi:plaintext;}
    html[dir="ltr"] .asp-theme-neon .asp-sub{direction:ltr;letter-spacing:.5em;}
    .asp-theme-neon .asp-sub .asp-wave-word{display:inline-block;animation:aspSubNeon 2.4s infinite ease-in-out;}
    .asp-theme-neon .asp-percent-row{font-family:ui-monospace,SF Mono,monospace;font-weight:700;font-size:clamp(2rem,7vw,3rem);color:var(--asp-text,#fff);direction:ltr;display:flex;align-items:baseline;text-shadow:0 0 30px var(--asp-accent,#00ffc6);}
    .asp-theme-neon .asp-percent{font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right;}
    .asp-theme-neon .asp-percent.asp-digit-bounce{animation:aspDigitNeon .4s ease-out;}
    .asp-theme-neon .asp-percent-sign{font-size:.5em;opacity:.7;margin-left:4px;}
    .asp-theme-neon .asp-tip{font-size:11px;opacity:.4;color:var(--asp-text,#fff);letter-spacing:.15em;min-height:14px;direction:rtl;unicode-bidi:plaintext;}
    html[dir="ltr"] .asp-theme-neon .asp-tip{direction:ltr;}
    @keyframes aspNeon{0%{left:-60px;}100%{left:100%;}}
    @keyframes aspSubNeon{0%,100%{opacity:.7;}50%{opacity:1;}}
    @keyframes aspDigitNeon{0%{transform:translateY(0);filter:brightness(1);}40%{transform:translateY(-6px) scale(1.08);filter:brightness(1.3);}100%{transform:translateY(0);filter:brightness(1);}}
    @media (prefers-reduced-motion: reduce){.asp-theme-neon .asp-neon span,.asp-theme-neon .asp-sub .asp-wave-word{animation:none!important;}.asp-theme-neon .asp-neon span{left:50%;transform:translateX(-50%);}}
  </style>
</div>
