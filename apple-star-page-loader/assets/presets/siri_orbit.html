{{LOGO}}
<svg class="asp-icon-svg" viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sog"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>
  <g transform="translate(80,65)" fill="none" stroke-linecap="round" filter="url(#sog)">
    <animate attributeName="opacity" values="0;1" dur=".45s" fill="freeze"/>

    <!-- Innermost fast orbit -->
    <circle r="16" stroke="#fff" stroke-width="2.6" stroke-dasharray="28 72" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <!-- Middle orbit (reverse) -->
    <circle r="26" stroke="{{ACCENT}}" stroke-width="2.4" stroke-dasharray="36 125" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <!-- Outer slow orbit -->
    <circle r="38" stroke="#fff" stroke-width="2" stroke-dasharray="28 210" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Outermost soft halo -->
    <circle r="48" stroke="{{ACCENT}}" stroke-width="1.2" stroke-dasharray="18 283" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Core pulse -->
    <circle r="3" fill="#fff">
      <animate attributeName="r" values="2.5;5;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="{{ACCENT}}" opacity="0.6">
      <animate attributeName="r" values="3;12;3" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
<div class="asp-brand-text" {{DIR}}>{{TEXT}}</div>
{{MAINT}}
