    <animate attributeName="width"  values="70;14;70" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x"      values="25;53;25" dur="2s" repeatCount="indefinite"/>

    <animate attributeName="rx"     values="3;25;3"  dur="2s" repeatCount="indefinite"/>

  </rect>
</svg>
