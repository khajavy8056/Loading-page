<!--
  Apple Star Page Loader v3.1.0 — Default preset: Apple Star Pulse (ECG)
  All animations are SMIL (<animate>/<animateTransform> inside the inline SVG).
  Text is static. Placeholders {{LOGO}}/{{TEXT}}/{{DIR}}/{{TEXT_COLOR}}/{{ACCENT}}/{{MAINT}}
  are replaced server-side by PHP.
-->
{{LOGO}}
<svg class="asp-icon-svg" viewBox="0 0 280 110" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="asg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="{{ACCENT}}" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
    <filter id="aglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fade-in -->
  <animate attributeName="opacity" values="0;1" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur="0.45s" fill="freeze"/>

  <!-- ECG track (static) -->
  <line x1="14" y1="60" x2="266" y2="60" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
  <line x1="0"  y1="60" x2="24"  y2="60" stroke="rgba(255,255,255,0)" stroke-width="1.2"/>
  <line x1="256" y1="60" x2="280" y2="60" stroke="rgba(255,255,255,0)" stroke-width="1.2"/>

  <!-- Progress trail behind blip (draws as blip passes) -->
  <line x1="14" y1="60" x2="14" y2="60" stroke="{{ACCENT}}" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <animate attributeName="x2" values="14;266" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </line>

  <!-- Outer glow (accent) — follows the blip -->
  <circle cx="14" cy="60" r="5" fill="url(#asg)">
    <animate attributeName="cx" values="14;266" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
    <animate attributeName="r"  values="6;22;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.06;0.94;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Core white blip -->
  <circle cx="14" cy="60" r="4.5" fill="#ffffff" filter="url(#aglow)">
    <animate attributeName="cx" values="14;266" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;5;3.5" dur="0.24s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Tick marks at edges -->
  <circle cx="14"  cy="60" r="1.6" fill="rgba(255,255,255,0.55)"/>
  <circle cx="266" cy="60" r="1.6" fill="rgba(255,255,255,0.55)"/>
</svg>
<div class="asp-brand-text" {{DIR}}>{{TEXT}}</div>
{{MAINT}}
