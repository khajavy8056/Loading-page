{{LOGO}}
<svg class="asp-icon-svg" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="brg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="{{ACCENT}}" stop-opacity="1"/>
      <stop offset="70%" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(60,40)">
    <circle r="12" fill="url(#brg)">
      <animate attributeName="r" values="10;26;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#fff">
      <animate attributeName="r" values="5;10;5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
<div class="asp-brand-text" {{DIR}}>{{TEXT}}</div>
{{MAINT}}
