{{LOGO}}
<svg class="asp-icon-svg" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <g fill="#fff">
    <circle cx="30" cy="40" r="6">
      <animate attributeName="cx" values="20;80;20" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;2;6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="40" r="6" fill="{{ACCENT}}">
      <animate attributeName="cx" values="20;80;20" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;2;6" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="40" r="6" opacity="0.6">
      <animate attributeName="cx" values="20;80;20" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;2;6" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
<div class="asp-brand-text" {{DIR}}>{{TEXT}}</div>
{{MAINT}}
