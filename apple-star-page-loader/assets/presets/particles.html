<!--
  Preset: Particles Glow — floating glowing particles + counter.
-->
<div class="asp-loader asp-theme-particles">
  <div class="asp-backdrop"></div>
  <canvas class="asp-particles-canvas"></canvas>
  <div class="asp-stage">
    <div class="asp-wave-text asp-sub-top"></div>
    <div class="asp-percent-row">
      <span class="asp-percent" data-value="0">0</span><span class="asp-percent-sign">%</span>
    </div>
    <div class="asp-bar">
      <div class="asp-bar-fill"></div>
    </div>
    <div class="asp-tip"></div>
  </div>
  <style>
    .asp-theme-particles{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .asp-theme-particles .asp-backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at center,#0b1020 0%,#05070e 80%);backdrop-filter:blur(var(--asp-blur,0px));-webkit-backdrop-filter:blur(var(--asp-blur,0px));}
    .asp-theme-particles .asp-particles-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
    .asp-theme-particles .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:2;}
    .asp-theme-particles .asp-sub-top{font-family:-apple-system,sans-serif;font-size:clamp(0.85rem,2vw,1.05rem);letter-spacing:0.5em;text-transform:uppercase;color:rgba(255,255,255,0.8);font-weight:600;}
    .asp-theme-particles .asp-sub-top .asp-wave-letter{display:inline-block;animation:aspWaveP 2.4s infinite ease-in-out;animation-delay:calc(var(--w)*0.08s);}
    .asp-theme-particles .asp-percent-row{font-family:ui-monospace,SF Mono,monospace;font-weight:800;font-size:clamp(3rem,12vw,6rem);color:var(--asp-text,#fff);line-height:1;display:flex;align-items:baseline;text-shadow:0 0 40px var(--asp-accent,#4aa3ff);}
    .asp-theme-particles .asp-percent{display:inline-block;font-variant-numeric:tabular-nums;min-width:1.8em;text-align:right;}
    .asp-theme-particles .asp-percent.asp-digit-bounce{animation:aspDigitBounceP 0.4s ease-out;}
    .asp-theme-particles .asp-percent-sign{font-size:0.4em;opacity:0.7;margin-left:4px;}
    .asp-theme-particles .asp-bar{position:relative;width:min(420px,78vw);height:4px;background:var(--asp-bar-bg,rgba(255,255,255,0.08));border-radius:999px;overflow:hidden;}
    .asp-theme-particles .asp-bar-fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--asp-accent,#4aa3ff),#fff);border-radius:999px;transition:width 0.35s cubic-bezier(0.22,1,0.36,1);box-shadow:0 0 16px var(--asp-accent,#4aa3ff);}
    .asp-theme-particles .asp-tip{font-size:12px;color:rgba(255,255,255,0.5);font-family:-apple-system,sans-serif;letter-spacing:0.2em;text-transform:uppercase;min-height:16px;text-align:center;}
    .asp-theme-particles .asp-logo-wrap img{max-height:60px;max-width:200px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(74,163,255,0.4));margin-bottom:6px;}
    @keyframes aspWaveP{0%,100%{transform:translateY(0);opacity:0.8;}50%{transform:translateY(-6px);opacity:1;}}
    @keyframes aspDigitBounceP{0%{transform:scale(1);filter:blur(0);}40%{transform:scale(1.15);filter:blur(1px);}100%{transform:scale(1);filter:blur(0);}}
    @media (prefers-reduced-motion: reduce){
      .asp-theme-particles .asp-sub-top .asp-wave-letter{animation:none!important;}
    }
  </style>
  <script>
    (function(){
      if(window.__aspParticlesInit)return;window.__aspParticlesInit=true;
      function bootParticles(){
        var canvas=document.querySelector('.asp-theme-particles .asp-particles-canvas');
        if(!canvas)return;
        var ctx=canvas.getContext('2d');if(!ctx)return;
        var accent=getComputedStyle(document.documentElement).getPropertyValue('--asp-accent').trim()||'#4aa3ff';
        function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
        resize();window.addEventListener('resize',resize);
        var pts=[];for(var i=0;i<60;i++){pts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2.5+0.5,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,a:Math.random()*Math.PI*2});}
        function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return{r:parseInt(h.substring(0,2),16),g:parseInt(h.substring(2,4),16),b:parseInt(h.substring(4,6),16)};}
        function draw(){
          var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
          var c=hexToRgb(accent);
          pts.forEach(function(p,i){
            p.x+=p.vx;p.y+=p.vy;p.a+=0.02;
            if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
            var pulse=0.5+Math.sin(p.a)*0.5;
            ctx.beginPath();ctx.arc(p.x,p.y,p.r+pulse*1.5,0,Math.PI*2);
            ctx.fillStyle='rgba('+c.r+','+c.g+','+c.b+','+(0.3+pulse*0.5)+')';ctx.fill();
            for(var j=i+1;j<pts.length;j++){
              var dx=p.x-pts[j].x,dy=p.y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
              if(d<110){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle='rgba('+c.r+','+c.g+','+c.b+','+(0.12*(1-d/110))+')';ctx.lineWidth=0.6;ctx.stroke();}
            }
          });
          requestAnimationFrame(draw);
        }
        draw();
      }
      if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',bootParticles);}else{bootParticles();}
    })();
  </script>
</div>
