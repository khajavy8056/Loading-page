<!-- Concentric Radar: expanding rings -->
<div class="asp-loader asp-theme-radar">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-radar"><div></div><div></div><div></div></div>
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-radar{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif;}
    .asp-theme-radar .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85));backdrop-filter:blur(var(--asp-blur,12px));-webkit-backdrop-filter:blur(var(--asp-blur,12px));}
    .asp-theme-radar .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;}
    .asp-theme-radar .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-radar .asp-radar{width:60px;height:60px;position:relative;}
    .asp-theme-radar .asp-radar div{position:absolute;inset:0;border:2px solid var(--asp-text,#fff);border-radius:50%;animation:asp-rdr 2s infinite cubic-bezier(.215,.61,.355,1);}
    .asp-theme-radar .asp-radar div:nth-child(2){animation-delay:-0.65s;}
    .asp-theme-radar .asp-radar div:nth-child(3){animation-delay:-1.3s;}
    @keyframes asp-rdr{0%{transform:scale(0);opacity:1;}100%{transform:scale(1.6);opacity:0;}}
    .asp-theme-radar .asp-wave-word{display:flex;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:90vw;font-weight:700;letter-spacing:.18em;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--asp-text,#fff);opacity:.9;direction:ltr;}
    html[dir="rtl"] .asp-theme-radar .asp-wave-word{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-radar .asp-wave-word .ltr,.asp-theme-radar .asp-wave-word .rtl{display:inline-block;}
    .asp-theme-radar .asp-wave-word .sp{width:.4em;display:inline-block;}
    @media (prefers-reduced-motion: reduce){.asp-theme-radar .asp-radar div{animation:none;transform:scale(.5)!important;opacity:.7!important;}}
  </style>
</div>
