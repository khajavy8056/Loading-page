<!-- Quantum Spin: three tilted rings rotating in 3D -->
<div class="asp-loader asp-theme-quantum">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-q"><div></div><div></div><div></div></div>
    <div class="asp-wave-word" id="asp-word"></div>
  </div>
  <style>
    .asp-theme-quantum{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif;perspective:200px;}
    .asp-theme-quantum .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85));backdrop-filter:blur(var(--asp-blur,12px));-webkit-backdrop-filter:blur(var(--asp-blur,12px));}
    .asp-theme-quantum .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;}
    .asp-theme-quantum .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-quantum .asp-q{width:54px;height:54px;position:relative;transform-style:preserve-3d;animation:asp-qr 3s infinite linear;}
    .asp-theme-quantum .asp-q div{position:absolute;inset:0;border:2px solid var(--asp-text,rgba(255,255,255,.85));border-radius:50%;}
    .asp-theme-quantum .asp-q div:nth-child(1){transform:rotateX(60deg) rotateY(0deg);border-color:var(--asp-text,#fff);}
    .asp-theme-quantum .asp-q div:nth-child(2){transform:rotateX(60deg) rotateY(60deg);border-color:var(--asp-accent,rgba(255,255,255,.6));}
    .asp-theme-quantum .asp-q div:nth-child(3){transform:rotateX(60deg) rotateY(120deg);border-color:rgba(255,255,255,.35);}
    @keyframes asp-qr{100%{transform:rotateZ(360deg) rotateX(20deg);}}
    .asp-theme-quantum .asp-wave-word{display:flex;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:90vw;font-weight:700;letter-spacing:.18em;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--asp-text,#fff);opacity:.9;direction:ltr;}
    html[dir="rtl"] .asp-theme-quantum .asp-wave-word{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-quantum .asp-wave-word .ltr,.asp-theme-quantum .asp-wave-word .rtl{display:inline-block;}
    .asp-theme-quantum .asp-wave-word .sp{width:.4em;display:inline-block;}
    @media (prefers-reduced-motion: reduce){.asp-theme-quantum .asp-q{animation:none;}}
  </style>
</div>
