{{LOGO}}
<svg class="asp-icon-svg" viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rdg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="{{ACCENT}}" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(80,65)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0;1" dur=".4s" fill="freeze"/>

    <!-- Grid circles -->
    <circle r="18" stroke-opacity="0.18"/>
    <circle r="32" stroke-opacity="0.13"/>
    <circle r="46" stroke-opacity="0.08"/>
    <!-- Cross lines -->
    <line x1="-46" y1="0" x2="46" y2="0" stroke-opacity="0.12"/>
    <line x1="0"   y1="-46" x2="0" y2="46" stroke-opacity="0.12"/>

    <!-- Sweep wedge -->
    <path d="M0,0 L46,0 A46,46 0 0,1 32.5,32.5 Z" fill="url(#rdg)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Sweep line -->
    <line x1="0" y1="0" x2="46" y2="0" stroke="{{ACCENT}}" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- Expanding ring 1 -->
    <circle r="4" fill="none" stroke="{{ACCENT}}">
      <animate attributeName="r" values="4;48;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;0.3;2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Expanding ring 2 -->
    <circle r="4" fill="none" stroke="#fff">
      <animate attributeName="r" values="4;48;4" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.6;0.3;1.6" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Expanding ring 3 -->
    <circle r="4" fill="none" stroke="{{ACCENT}}" opacity="0.6">
      <animate attributeName="r" values="4;48;4" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.4;0.3;1.4" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Center dot -->
    <circle r="4" fill="#fff"/>
    <circle r="2" fill="{{ACCENT}}">
      <animate attributeName="r" values="1.5;3;1.5" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
<div class="asp-brand-text" {{DIR}}>{{TEXT}}</div>
{{MAINT}}
