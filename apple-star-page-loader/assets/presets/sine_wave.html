<!--
  Apple Star Page Loader — sine wave (v3.0.1)
  Fixed: dir attribute controls LTR/RTL so English letters never appear
  reversed on RTL sites, and the brand text gently pulses in sync with
  the animation.
-->
<div class="asp-loader asp-theme-sine">
  <div class="asp-backdrop"></div>
  <div class="asp-stage">
    <div class="asp-logo-wrap" id="asp-logo-slot"></div>
    <div class="asp-sine"><div></div><div></div><div></div><div></div></div>
    <div class="asp-wave-word" id="asp-word" dir="ltr"></div>
  </div>
  <style>
    .asp-theme-sine{position:fixed;inset:0;z-index:2147483647;display:flex!important;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Vazirmatn",Tahoma,Arial,sans-serif!important;margin:0!important;padding:0!important;}
    .asp-theme-sine .asp-backdrop{position:absolute;inset:0;background:var(--asp-bg,rgba(10,10,15,0.85))!important;backdrop-filter:blur(var(--asp-blur,16px));-webkit-backdrop-filter:blur(var(--asp-blur,16px));}
    .asp-theme-sine .asp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:28px;z-index:2;}
    .asp-theme-sine .asp-logo-wrap img{max-height:70px;max-width:220px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
    .asp-theme-sine .asp-wave-word{position:relative;display:flex!important;align-items:center;gap:.08em;justify-content:center;flex-wrap:wrap;max-width:92vw;font-weight:700!important;letter-spacing:.18em;font-size:clamp(0.95rem,3vw,1.4rem);color:var(--asp-text,#fff)!important;-webkit-text-fill-color:var(--asp-text,#fff)!important;opacity:.9;padding:0;margin:0;unicode-bidi:isolate;direction:ltr;}
    .asp-theme-sine .asp-wave-word[dir="rtl"]{direction:rtl;letter-spacing:0;font-weight:600;}
    .asp-theme-sine .asp-wave-word .ltr,
    .asp-theme-sine .asp-wave-word .rtl{display:inline-block;animation:asp-sw-letter 2s infinite ease-in-out!important;animation-delay:calc(var(--w) * 0.08s)!important;will-change:transform,opacity;transform-origin:center;}
    .asp-theme-sine .asp-wave-word .rtl{white-space:nowrap;animation-delay:calc(var(--w) * 0.18s)!important;}
    .asp-theme-sine .asp-wave-word .sp{width:.4em;display:inline-block;flex-shrink:0;}
    .asp-theme-sine .asp-sine{display:flex;gap:10px;align-items:center;height:50px;}
.asp-theme-sine .asp-sine div{width:12px;height:12px;background:var(--asp-text,#fff);border-radius:50%;animation:asp-sn 1.2s infinite ease-in-out!important;}
.asp-theme-sine .asp-sine div:nth-child(1){animation-delay:0s!important;}
.asp-theme-sine .asp-sine div:nth-child(2){animation-delay:.15s!important;}
.asp-theme-sine .asp-sine div:nth-child(3){animation-delay:.3s!important;}
.asp-theme-sine .asp-sine div:nth-child(4){animation-delay:.45s!important;}
@keyframes asp-sn{0%,100%{transform:translateY(0) scale(.8);opacity:.5;}50%{transform:translateY(-18px) scale(1.2);opacity:1;box-shadow:0 0 14px var(--asp-text,#fff);}}
    @keyframes asp-sw-letter{
      0%,100%{transform:translateY(0) scale(1);opacity:.85;}
      50%{transform:translateY(-6px) scale(1.05);opacity:1;text-shadow:0 6px 14px rgba(0,0,0,.4),0 0 14px rgba(255,255,255,.3);}
    }
    .asp-theme-sine .asp-maint{margin-top:6px;text-align:center;color:rgba(255,255,255,0.85)!important;max-width:560px;padding:0 20px;}
    .asp-theme-sine .asp-maint-timer{font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace!important;font-size:clamp(1.1rem,3vw,1.7rem);font-weight:700;letter-spacing:.08em;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:0 0 20px rgba(255,255,255,0.4);direction:ltr!important;unicode-bidi:isolate;display:inline-block;}
    .asp-theme-sine .asp-maint-timer .asp-sep{opacity:.6;display:inline-block;animation:asp-blink 1s steps(2) infinite;margin:0 2px;}
    @keyframes asp-blink{50%{opacity:.15;}}
    .asp-theme-sine .asp-maint-msg{margin-top:12px;font-size:clamp(.85rem,1.8vw,1rem);line-height:1.7;opacity:.8;}
    .asp-theme-sine .asp-maint-lbl{margin-bottom:6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;}
    @media (prefers-reduced-motion: reduce){
      .asp-theme-sine .asp-wave-word .ltr,
      .asp-theme-sine .asp-wave-word .rtl,
      .asp-theme-sine .asp-pulse-dot,
      .asp-theme-sine .asp-freq-bars span,
      .asp-theme-sine .asp-sine div,
      .asp-theme-sine .asp-ecg-blip2,
      .asp-theme-sine .asp-siri div,
      .asp-theme-sine .asp-radar div,
      .asp-theme-sine .asp-breath,
      .asp-theme-sine .asp-q,
      .asp-theme-sine .asp-morph div,
      .asp-theme-sine .asp-dots div{animation:none!important;}
    }
    @media (max-width:480px){
      .asp-theme-sine .asp-wave-word{letter-spacing:.06em;}
      .asp-theme-sine .asp-wave-word .sp{width:.3em;}
    }
  </style>
</div>
